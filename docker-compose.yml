services:
  bridge:
    build: .
    env_file:
      - ./python/.env
    ports:
      - "8080:8080"
    volumes:
      - ./python/data:/app/python/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
